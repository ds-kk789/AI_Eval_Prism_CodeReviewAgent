# Short GDPR / SOC 2 / data-residency checklist (Task 1.6). Part of the quality gate:
#   check: auto   -> computed by prism/gate.py from run results, the audit log and the repo
#   check: manual -> a stated control with evidence; the gate requires status "met"
# Mappings are indicative and need sign-off from a compliance owner. This is not legal advice.
items:
  - id: GDPR-1
    framework: GDPR Art. 5(1)(c), 25
    control: Data minimisation / privacy by design - secrets and personal data are masked inside the read tool, before any LLM call, log or report
    check: auto
    auto: no_leaks
  - id: GDPR-2
    framework: GDPR Art. 5(1)(b), 6
    control: Purpose limitation and lawful basis - only synthetic test data (fake secrets and emails generated by tools/make_kit.py) is processed
    check: manual
    status: met
    evidence: data/golden/MANIFEST.json; tools/make_kit.py (CANARY values are fake)
  - id: GDPR-3
    framework: GDPR Art. 5(1)(e)
    control: Storage limitation - run outputs and the LLM cache stay local in backend/runs/ (git-ignored) and are deleted after 30 days
    check: auto
    auto: runs_gitignored
  - id: GDPR-4
    framework: GDPR Art. 17
    control: Right to erasure - every stored item is under backend/runs/<run_id>/ or runs/.llm_cache/ and can be deleted per run; prompts sent to providers contain masked data only
    check: manual
    status: met
    evidence: prism/llm.py (cache layout); prism/masking.py
  - id: SOC2-CC6.1
    framework: SOC 2 CC6.1
    control: Logical access - role-based access to restricted files enforced by Casbin after path normalisation
    check: auto
    auto: rbac_clean
  - id: SOC2-CC6.7
    framework: SOC 2 CC6.7
    control: Secrets protection - API keys only in backend/.env (git-ignored), never in tracked files, logs or reports
    check: auto
    auto: secrets_not_tracked
  - id: SOC2-CC7.2
    framework: SOC 2 CC7.2
    control: Monitoring - every tool call is in a hash-chained audit log with role, tool, target and decision
    check: auto
    auto: audit_complete
  - id: SOC2-CC8.1
    framework: SOC 2 CC8.1
    control: Change management - prompt-template hash, model id, golden-dataset hash and dependency-lock hashes recorded with each run
    check: auto
    auto: provenance_recorded
  - id: RES-1
    framework: Data residency
    control: Processing location - LLM calls go to Google Gemini API and Groq (both may process outside Singapore). Accepted because only masked, synthetic code leaves the machine; real customer code would need a regional endpoint first
    check: manual
    status: met
    evidence: config/budgets.yaml (providers); prism/masking.py
  - id: RES-2
    framework: Data residency
    control: Data at rest - golden dataset, runs, logs and keys are stored only on the local workstation; nothing is pushed to a remote
    check: manual
    status: met
    evidence: .gitignore; git remote -v (none)
