# Models, call caps and token budgets (Task 1.2). Quotas checked 9 Nov 2026:
#   Gemini 3.5 Flash-Lite free tier: 15 RPM, 250K TPM, 500 RPD (per Google Cloud project, not per key)
#   Groq gpt-oss-120b: 30 RPM, 8K TPM, 1K RPD, 200K tokens/day (per organization)
models:
  agent:
    provider: gemini
    model: gemini-3.5-flash-lite      # exact id verified against the models list in phase 1
  judge:
    provider: groq
    model: openai/gpt-oss-120b        # other model family than the agents
    # Account 2 (separate Groq organization = separate quota). Account 1 (GROQ_API_KEY) used 52 judge
    # requests in the first main run on 9 Nov; the ledger counts each key on its own.
    key: GROQ_API_KEY_2

# Hard daily caps enforced by the call ledger (runs/.llm_ledger.json), counted in billed requests.
# First full pass ~175 requests: the tool-using baseline makes ~3 requests per sample (smoke test, 9 Nov).
daily_call_caps:
  gemini: 200
  groq: 120          # per key; real limit 1K requests + 200K tokens/day. Judge uses ~1.1-1.4K tokens/request.

# Requests started per minute (below the provider limits: Gemini 15 RPM; Groq 8K TPM ~ 3 judge calls/min).
rpm:
  gemini: 13
  groq: 3

concurrency:
  gemini: 4     # stays under 15 RPM with ~3 s calls
  groq: 1       # 8K TPM allows ~3-5 judge calls per minute

# Token budget per review request, per agent (input + output). Reported as actual vs budget.
token_budget_per_request:
  coordinator: 0        # deterministic, no LLM
  reader: 0             # deterministic, no LLM
  reviewer: 3000
  baseline: 3000
  judge: 4000
